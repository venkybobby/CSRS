# The 5 demo-script cases from meridian_csr_estimator_MVP1_stories.md,
# encoded as machine-checkable expectations. This is the CI/CD deploy gate
# (plan §6.3/§7): a PR or deploy that breaks tool-routing or calculation
# behavior fails here before reaching staging/prod.
#
# Each case is checked in two independent modes (see run_eval.py):
#   deterministic  -- calls resolve_procedure + estimate_member_cost
#                      directly (no live agent needed; runs on every PR)
#   live           -- sends `question` through a deployed/local agent and
#                      additionally verifies tool-call ORDER from the ADK
#                      session trace, and that zero GUARDRAIL_VIOLATION
#                      events fire on these known-good cases (post-deploy,
#                      per plan §6.3's dev/staging/prod pipeline stages)

cases:
  - id: demo_1_partial_deductible_and_coinsurance
    question: "M1002 wants an MRI on his knee, what does he owe?"
    member_id: "M1002"
    expected_cpt_code: "73721"
    expected_response_type: "STANDARD_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_fields:
      breakdown.deductible_remaining: "300.00"
      breakdown.applied_to_deductible: "300.00"
      breakdown.balance_after_deductible: "850.00"
      breakdown.coinsurance_amount: "170.00"
      breakdown.member_cost: "470.00"
      breakdown.oop_cap_triggered: false
      breakdown.prior_auth_required: false

  - id: demo_2_oop_max_binding
    question: "What's James Whitaker M1004 looking at for knee surgery?"
    member_id: "M1004"
    expected_cpt_code: "29881"
    expected_response_type: "STANDARD_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_fields:
      breakdown.negotiated_rate: "6200.00"
      breakdown.oop_remaining: "150.00"
      breakdown.member_cost: "150.00"
      breakdown.oop_cap_triggered: true

  - id: demo_3a_embedded_family_m1006
    question: "Same question for M1007 and M1006 -- knee surgery"
    member_id: "M1006"
    expected_cpt_code: "29881"
    expected_response_type: "STANDARD_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_fields:
      breakdown.member_cost: "1860.00"
      breakdown.oop_remaining: "3100.00"
      breakdown.triggering_threshold: "INDIVIDUAL"

  - id: demo_3b_embedded_family_m1007
    question: "Same question for M1007 and M1006 -- knee surgery"
    member_id: "M1007"
    expected_cpt_code: "29881"
    expected_response_type: "STANDARD_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_fields:
      breakdown.member_cost: "1860.00"
      breakdown.oop_remaining: "6100.00"
      breakdown.triggering_threshold: "FAMILY"
    # The spec's own acceptance note (Story 5): "If it returns identical
    # numbers [as demo_3a], the per-member accumulator lookup is wrong" --
    # here that means oop_remaining/triggering_threshold, NOT member_cost,
    # which is legitimately equal in this specific case. See
    # tests/unit/test_calculator_family.py for the full reconciliation of
    # this with the spec's own worked example.
    must_differ_from: demo_3a_embedded_family_m1006
    must_differ_fields: [breakdown.oop_remaining, breakdown.triggering_threshold]

  - id: demo_4_termed_member_block
    question: "M1005 -- anything, what do they owe?"
    member_id: "M1005"
    expected_cpt_code: null  # eligibility check blocks before any procedure lookup
    expected_response_type: "TERMED_BLOCK"
    expected_tool_sequence: [check_eligibility]
    expected_message_contains: ["Priya Raman", "2026-05-31", "not eligible"]

  - id: demo_5_honest_miss
    question: "Cardiac CT for M1003"
    member_id: "M1003"
    expected_cpt_code: null  # never on file -- resolve_procedure must return NOT_ON_FILE
    expected_response_type: "RATE_NOT_FOUND"
    expected_tool_sequence: [check_eligibility, resolve_procedure]
    expected_message_contains: ["don't have a negotiated rate", "Do not estimate"]

  # --- Regression: clarify gate ------------------------------------------
  #
  # The gate substring-matched "colonoscopy" and returned before any scoring
  # ran, so it asked even when the CSR had already said which kind they
  # meant -- "preventive colonoscopy" is an exact search_aliases entry on
  # 45380 and scored 100, and that match was discarded to ask about it.
  # Locked in here because the failure is invisible in a single-turn test:
  # a second turn resolves through resolve_clarification and looks correct.

  - id: preventive_colonoscopy_resolves_without_asking
    question: "M1001 wants a preventive colonoscopy"
    member_id: "M1001"
    expected_cpt_code: "45380"
    expected_response_type: "PREVENTIVE_ZERO_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_message_contains: ["$0", "preventive"]

  - id: diagnostic_colonoscopy_resolves_without_asking
    question: "M1001 needs a diagnostic colonoscopy"
    member_id: "M1001"
    expected_cpt_code: "45378"
    expected_response_type: "STANDARD_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]

  # --- Ambiguity above the match threshold --------------------------------
  #
  # The clarify gate used to run only BELOW the match threshold, so a query
  # that tied across several codes at a high score was resolved silently
  # while a slightly weaker phrasing of the same question was asked about.
  # Bare "MRI" returned MRI Brain without asking; "an MRI" asked. Every
  # figure on that screen would have been correct arithmetic about the wrong
  # body part.
  #
  # Gated here rather than only in tests/unit/test_rate_matcher.py because
  # this is the one failure mode the deployed agent can reintroduce on its
  # own: the tool can return NEEDS_CLARIFICATION correctly and the model can
  # still answer over the top of it by picking a procedure itself.

  - id: bare_procedure_family_asks_which_one
    question: "M1001 wants an MRI"
    member_id: "M1001"
    expected_cpt_code: null  # nothing may be priced until the CSR says which
    expected_response_type: "NEEDS_CLARIFICATION"
    expected_tool_sequence: [check_eligibility, resolve_procedure]
    # All three MRI codes must be on offer. Two would mean the tie check found
    # some of the ambiguity and silently resolved the rest.
    expected_candidate_cpt_codes: ["70551", "72148", "73721"]

  - id: qualified_procedure_does_not_ask
    question: "M1001 wants an MRI on his knee"
    member_id: "M1001"
    expected_cpt_code: "73721"
    expected_response_type: "STANDARD_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    # The pair is the assertion. If these ever return the same response_type
    # the gate is dead: either it stopped asking when it should, or it
    # started asking when the CSR had already said which one.
    must_differ_from: bare_procedure_family_asks_which_one
    must_differ_fields: [response_type]

  # --- Cold twin: turn-2 resolution needs turn-1 context ------------------
  #
  # "knee" sent cold -- no pending clarification, nothing carried over --
  # must NOT resolve to MRI Knee. The word is shared by three different
  # procedures (MRI Knee, Knee X-Ray, Knee Arthroscopy/Surgery), so it asks
  # rather than guesses. This is the negative control for
  # clarify_mri_then_knee_resolves_to_mri_knee below: without it, a system
  # that just keyword-mapped "knee" to 73721 would pass that case too, for
  # the wrong reason. Paired via must_differ_from on the multi-turn case, the
  # same way qualified_procedure_does_not_ask is paired with
  # bare_procedure_family_asks_which_one above.

  - id: knee_without_pending_clarification_refuses
    question: "knee"
    member_id: "M1001"
    expected_cpt_code: null
    expected_response_type: "NEEDS_CLARIFICATION"
    expected_tool_sequence: [check_eligibility, resolve_procedure]
    expected_candidate_cpt_codes: ["29881", "73562", "73721"]

  # --- Exclusion vs. no-rate ---------------------------------------------
  #
  # The subtlest trap in the set: S8092 has a NULL negotiated_rate AND is
  # excluded on Bronze, so the two paths are reachable with the same code and
  # must give different answers. Bronze must say "not a covered benefit"
  # (exclusion fires first); Silver/Gold must say "no rate on file".

  - id: exclusion_beats_missing_rate_on_bronze
    question: "acupuncture for M1004"
    member_id: "M1004"
    expected_cpt_code: "S8092"
    expected_response_type: "EXCLUSION"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_message_contains: ["excluded", "not a covered benefit"]

  - id: same_code_is_rate_not_found_on_silver
    question: "acupuncture for M1001"
    member_id: "M1001"
    expected_cpt_code: "S8092"
    expected_response_type: "RATE_NOT_FOUND"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_message_contains: ["don't have a negotiated rate"]
    must_differ_from: exclusion_beats_missing_rate_on_bronze
    must_differ_fields: [response_type]

  # --- Date of service ----------------------------------------------------
  #
  # Every case below pins `today`, because each asserts behavior relative to
  # a calendar position (M1010 coverage ends 2026-08-31, plan year ends
  # 2026-12-31). Without pinning, these rot into failures on their own as
  # real time passes rather than because anyone changed the code.

  - id: dos_dated_yes_inside_coverage
    question: "MRI on his knee for M1010"
    member_id: "M1010"
    today: "2026-08-13"
    date_of_service: "2026-08-20"
    expected_cpt_code: "73721"
    expected_response_type: "STANDARD_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_message_contains:
      - "2026-08-20"
      - "falls within the coverage period"
      - "balances as of 2026-08-13"

  - id: dos_dated_no_after_coverage_ends
    question: "MRI on his knee for M1010"
    member_id: "M1010"
    today: "2026-08-13"
    date_of_service: "2026-09-15"
    expected_cpt_code: null  # blocked before any procedure lookup
    expected_response_type: "NOT_ELIGIBLE_ON_DOS"
    expected_tool_sequence: [check_eligibility]
    expected_fields:
      reason: "COVERAGE_ENDED"
    expected_message_contains: ["George Ellery", "2026-08-31", "2026-09-15", "Do not quote"]
    # Same member, same question, same day -- only the date differs. If these
    # ever return the same response_type the as-of-date evaluation is dead.
    must_differ_from: dos_dated_yes_inside_coverage
    must_differ_fields: [response_type]

  - id: dos_plan_year_boundary_is_a_refusal
    question: "MRI on his knee for M1002"
    member_id: "M1002"
    today: "2026-11-15"
    date_of_service: "2027-01-20"
    expected_cpt_code: null
    expected_response_type: "PLAN_YEAR_BOUNDARY"
    expected_tool_sequence: [check_eligibility]
    expected_message_contains:
      - "next plan year"
      - "2026-12-31"
      - "MER-SLV-2026"
      - "Do not quote a cost for this date"

  - id: dos_in_past_is_a_claims_question
    question: "MRI on his knee for M1002"
    member_id: "M1002"
    today: "2026-08-13"
    date_of_service: "2026-07-20"
    expected_cpt_code: null
    expected_response_type: "DATE_OF_SERVICE_INVALID"
    expected_tool_sequence: [check_eligibility]
    expected_fields:
      reason: "IN_PAST"
    expected_message_contains: ["in the past", "Route to Claims"]

  - id: dos_beyond_ninety_days_is_refused
    question: "MRI on his knee for M1002"
    member_id: "M1002"
    today: "2026-08-13"
    date_of_service: "2026-12-01"
    expected_cpt_code: null
    expected_response_type: "DATE_OF_SERVICE_INVALID"
    expected_tool_sequence: [check_eligibility]
    expected_fields:
      reason: "BEYOND_MAX_HORIZON"
    expected_message_contains: ["more than 90 days out", "2026-11-11"]

  # No date of service: the pre-existing warning behavior must be unchanged,
  # which is the property that keeps every case above this block honest.
  - id: no_dos_preserves_future_term_warning
    question: "MRI on his knee for M1010"
    member_id: "M1010"
    today: "2026-08-13"
    expected_cpt_code: "73721"
    expected_response_type: "STANDARD_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_message_contains: ["Coverage ends 2026-08-31", "confirm date of service"]

  # --- Prior authorisation (Story 4) --------------------------------------
  #
  # The gap the story-coverage audit found and MVP1_STATUS.md disclosed: the
  # prior-auth warning was verified by the integration suite in both
  # directions and visible in the screenshots, but had no case here -- so it
  # was verified and not GATED. A regression that stopped the warning
  # surfacing would have passed the post-deploy check and reached a CSR, who
  # would then quote a cost on a procedure that can be denied for want of an
  # authorisation nobody mentioned.
  #
  # The negative direction was already gated, incidentally rather than
  # deliberately: demo_1 asserts prior_auth_required is false for 73721 on
  # Silver. What was missing is the positive, and the pair that makes either
  # meaningful.
  #
  # Same shape as the exclusion/no-rate pair above, and for the same reason:
  # one CPT code, two plans, two different obligations on the rep. 70551 is
  # in Silver's prior_auth_required_codes and is not in Gold's, so a change
  # that made the flag constant in either direction breaks one of these two
  # even though both remain STANDARD_COST quotes with correct arithmetic.
  # That is the failure worth catching -- the money is right and the
  # instruction to the member is wrong.

  - id: prior_auth_required_on_silver
    question: "MRI brain for M1002"
    member_id: "M1002"
    expected_cpt_code: "70551"
    expected_response_type: "STANDARD_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_fields:
      breakdown.negotiated_rate: "1450.00"
      breakdown.member_cost: "530.00"
      breakdown.prior_auth_required: true
    # Story 4 fixes this wording; the rep reads it to a member, so drift in
    # it is a client-visible change and not a copy tweak.
    # Story 4 mandates this wording verbatim, including the plan name -- the
    # rep reads it to a member, so drift is a client-visible change and not a
    # copy tweak. Asserted against the spec's string, not the UI's: the
    # frontend renders its own longer variant, and it was the spec's that
    # Story 4 fixed.
    expected_message_contains:
      - "Prior authorization required for MRI Brain (70551)"
      - "Meridian Silver 2026"
      - "Advise member to obtain auth before service"
      - "assumes auth is approved"

  - id: prior_auth_not_required_on_gold
    question: "MRI brain for M1003"
    member_id: "M1003"
    expected_cpt_code: "70551"
    expected_response_type: "STANDARD_COST"
    expected_tool_sequence: [check_eligibility, resolve_procedure, estimate_member_cost]
    expected_fields:
      breakdown.negotiated_rate: "1450.00"
      breakdown.member_cost: "145.00"
      breakdown.prior_auth_required: false
    must_differ_from: prior_auth_required_on_silver
    must_differ_fields: [breakdown.prior_auth_required]

# --- Multi-turn cases -------------------------------------------------------
#
# demo_scripts.yaml's `cases:` above are single-question: run_eval.py's
# deterministic mode calls resolve_procedure/estimate_member_cost exactly
# once per case. That cannot exercise resolve_clarification, the real turn-2
# API -- so the clarification exchange (Story 2/7) that
# scripts/generate_preview_fixtures.py renders as the `clarify-answered-knee`
# pane had no eval case behind it, only tests/unit/test_rate_matcher.py's
# test_clarification_answer_resolves_to_knee. That test still exists and
# still passes; this is the same exchange promoted to a gated eval case, run
# by evals/run_eval.py's run_multi_turn().
#
# Each case's turns list is [turn 1, turn 2]. Turn 1 is checked the same way
# a NEEDS_CLARIFICATION case above is (response_type, candidate set). Turn 2
# calls resolve_clarification() restricted to the CODES TURN 1 ACTUALLY
# OFFERED -- never the full catalog -- so a passing case proves the
# resolution came from the carried-over candidate pool, not from re-matching
# the answer against the whole rate sheet. The resolved procedure is then
# priced through estimate_member_cost(), so the final breakdown fields are
# asserted exactly like any other STANDARD_COST case.
#
# must_differ_from points at knee_without_pending_clarification_refuses above: the
# same word ("knee"), asked with no turn-1 context, must NOT reach
# STANDARD_COST. That is what rules out a matcher that simply keyword-maps
# "knee" to 73721 -- such a matcher would pass this case's turn 2 for the
# wrong reason, but it would also resolve the cold twin, which must ask
# instead.
multi_turn_cases:
  - id: clarify_mri_then_knee_resolves_to_mri_knee
    member_id: "M1001"
    turns:
      - question: "M1001 wants an MRI"
        expected_response_type: "NEEDS_CLARIFICATION"
        expected_candidate_cpt_codes: ["70551", "72148", "73721"]
      - answer: "knee"
        expected_response_type: "STANDARD_COST"
        expected_cpt_code: "73721"
        expected_fields:
          breakdown.negotiated_rate: "1150.00"
          breakdown.applied_to_deductible: "1150.00"
          breakdown.balance_after_deductible: "0.00"
          breakdown.coinsurance_amount: "0.00"
          breakdown.member_cost: "1150.00"
          breakdown.oop_cap_triggered: false
          breakdown.prior_auth_required: false
    must_differ_from: knee_without_pending_clarification_refuses
    must_differ_fields: [response_type]
