# Deploy pipeline (plan §6.3), parameterized by _ENVIRONMENT so the same
# build definition runs unchanged across dev/staging/prod. Config/secrets
# come from substitution variables + Secret Manager references (per-trigger
# config), never hardcoded here.
#
# Promotion/approval model: three separate Cloud Build triggers reference
# this one file (infra/modules/cicd) --
#   csrsupport-deploy-dev:      auto-runs on push to main, _ENVIRONMENT=dev
#   csrsupport-deploy-staging:  manual invocation only (the "approval gate"
#                                for this MVP1 setup is that only members of
#                                the approvers group can invoke it -- see
#                                infra/modules/cicd's trigger IAM bindings)
#   csrsupport-deploy-prod:     manual invocation only, same pattern
# A Cloud Deploy delivery pipeline with native approval stages is the more
# sophisticated version of this if manual-trigger-as-approval-gate proves
# too coarse; not needed for MVP1 scale.
#
# Why DB migrations run as a Cloud Run Job, not a plain Cloud Build step:
# Cloud SQL has no public IP (plan §3.2) and Cloud Build's default worker
# pool has no VPC route to it. A Cloud Run Job with a VPC connector does --
# see infra/modules/cloud_run_job and db/migrations/Dockerfile.

steps:
  - id: build-bff
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - bff/Dockerfile
      - -t
      - "${_ARTIFACT_REGISTRY}/bff:${SHORT_SHA}"
      - "."

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - -t
      - "${_ARTIFACT_REGISTRY}/frontend:${SHORT_SHA}"
      - "frontend/"

  - id: build-migrate
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - db/migrations/Dockerfile
      - -t
      - "${_ARTIFACT_REGISTRY}/migrate:${SHORT_SHA}"
      - "."

  - id: push-images
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >
        docker push ${_ARTIFACT_REGISTRY}/bff:${SHORT_SHA} &&
        docker push ${_ARTIFACT_REGISTRY}/frontend:${SHORT_SHA} &&
        docker push ${_ARTIFACT_REGISTRY}/migrate:${SHORT_SHA}

  - id: run-db-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - >
        gcloud run jobs update csrsupport-migrate-${_ENVIRONMENT}
        --image=${_ARTIFACT_REGISTRY}/migrate:${SHORT_SHA}
        --project=${_PROJECT_ID} --region=${_REGION} &&
        gcloud run jobs execute csrsupport-migrate-${_ENVIRONMENT}
        --project=${_PROJECT_ID} --region=${_REGION} --wait

  - id: deploy-agent-engine
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - >
        pip install --no-cache-dir -r agent/requirements.txt &&
        python agent/csr_agent/deploy/deploy_agent_engine.py
    env:
      - "GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}"
      - "GOOGLE_CLOUD_LOCATION=${_REGION}"
      - "STAGING_BUCKET=${_STAGING_BUCKET}"
      - "AGENT_ENGINE_SERVICE_ACCOUNT=${_AGENT_ENGINE_SA}"
      - "AGENT_ENGINE_OUTPUT_FILE=/workspace/agent_engine_resource_name.txt"
    secretEnv: ["DATABASE_URL"]

  - id: deploy-bff
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - >
        gcloud run deploy csrsupport-bff-${_ENVIRONMENT}
        --image=${_ARTIFACT_REGISTRY}/bff:${SHORT_SHA}
        --project=${_PROJECT_ID} --region=${_REGION}
        --update-env-vars=AGENT_ENGINE_RESOURCE_NAME=$(cat /workspace/agent_engine_resource_name.txt)

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "csrsupport-frontend-${_ENVIRONMENT}"
      - "--image=${_ARTIFACT_REGISTRY}/frontend:${SHORT_SHA}"
      - "--project=${_PROJECT_ID}"
      - "--region=${_REGION}"

  # --mode live only, not --mode both: the deterministic half needs direct
  # DB access, which (like the migration step) this plain Cloud Build step
  # doesn't have -- that half already ran in pr-checks.yaml against an
  # ephemeral Postgres container on the Cloud Build network (no VPC needed
  # there). Post-deploy, --mode live talks to the deployed Agent Engine over
  # the public Vertex AI API and doesn't touch Postgres directly at all --
  # the deployed stack reaches the DB through its own VPC-connected identity.
  - id: eval-suite-post-deploy
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - >
        pip install --no-cache-dir -r requirements-dev.txt &&
        AGENT_ENGINE_RESOURCE_NAME=$(cat /workspace/agent_engine_resource_name.txt)
        python evals/run_eval.py --mode live --env ${_ENVIRONMENT}

substitutions:
  _ENVIRONMENT: "dev"
  _PROJECT_ID: "csrs-504922"
  _REGION: "us-central1"
  _ARTIFACT_REGISTRY: "us-central1-docker.pkg.dev/csrs-504922/csrsupport"
  _STAGING_BUCKET: "gs://csrsupport-dev-agent-engine-staging"
  _AGENT_ENGINE_SA: "sa-agent-engine-dev@csrs-504922.iam.gserviceaccount.com"
  _AGENT_ENGINE_DB_URL_SECRET: "csrsupport-agent-engine-dev-db-url"

# Fetched only for steps that list it under secretEnv (deploy-agent-engine
# above) -- staging/prod aren't on Supabase yet (still Cloud SQL + IAM auth,
# see agent/csr_agent/deploy/deploy_agent_engine.py's _db_env_vars()), so
# this substitution and secret only need to resolve for the dev trigger
# today.
availableSecrets:
  secretManager:
    - versionName: "projects/${_PROJECT_ID}/secrets/${_AGENT_ENGINE_DB_URL_SECRET}/versions/latest"
      env: "DATABASE_URL"

options:
  logging: CLOUD_LOGGING_ONLY
